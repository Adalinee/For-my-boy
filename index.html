<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cada latido me recuerda a ti</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@200;300&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --rose: #ff4d6d;
            --rose-soft: #ff85a1;
            --rose-pale: #ffc2d1;
            --gold: #d4a574;
            --deep: #0a0408;
            --surface: rgba(255, 255, 255, 0.04);
            --glass: rgba(255, 255, 255, 0.07);
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--deep);
            font-family: 'Cormorant Garamond', serif;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        #bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse 80% 60% at 20% 80%, #1a0010 0%, transparent 60%),
                radial-gradient(ellipse 60% 80% at 80% 20%, #100018 0%, transparent 60%),
                radial-gradient(ellipse 100% 100% at 50% 50%, #0f0008 0%, #050204 100%);
            animation: bgPulse 8s ease-in-out infinite alternate;
        }

        @keyframes bgPulse {
            0% {
                filter: brightness(1);
            }

            100% {
                filter: brightness(1.3);
            }
        }

        #canvas {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }

        #scene {
            position: fixed;
            inset: 0;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(1.5rem, 5vw, 3rem);
            padding: 2rem;
        }

        #titulo {
            text-align: center;
            opacity: 0;
            animation: fadeIn 2s 0.5s ease forwards;
            pointer-events: none;
        }

        #titulo p {
            font-size: clamp(0.75rem, 3vw, 0.9rem);
            font-family: 'Montserrat', sans-serif;
            font-weight: 200;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.3);
            margin-bottom: 0.5rem;
        }

        #titulo h1 {
            font-size: clamp(1.4rem, 5.5vw, 2.2rem);
            font-weight: 300;
            font-style: italic;
            color: rgba(255, 255, 255, 0.85);
            line-height: 1.3;
            letter-spacing: 0.02em;
        }

        /* ── Corazón ── */
        #heart-wrap {
            position: relative;
            width: clamp(140px, 45vw, 200px);
            height: clamp(140px, 45vw, 200px);
            cursor: pointer;
            user-select: none;
        }

        #heart-glow {
            position: absolute;
            inset: -30%;
            background: radial-gradient(circle, rgba(255, 77, 109, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            animation: glowPulse 2.5s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes glowPulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.6;
            }

            50% {
                transform: scale(1.15);
                opacity: 1;
            }
        }

        #heart-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 18px rgba(255, 77, 109, 0.5)) drop-shadow(0 0 40px rgba(255, 77, 109, 0.2));
            transition: filter 0.2s;
            animation: heartIdle 2.5s ease-in-out infinite;
        }

        @keyframes heartIdle {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.04);
            }
        }

        .beating {
            animation: heartBeat 0.5s ease-out !important;
        }

        @keyframes heartBeat {
            0% {
                transform: scale(1);
            }

            25% {
                transform: scale(1.28);
            }

            50% {
                transform: scale(1.12);
            }

            75% {
                transform: scale(1.22);
            }

            100% {
                transform: scale(1);
            }
        }

        #hint {
            font-family: 'Montserrat', sans-serif;
            font-weight: 200;
            font-size: clamp(0.65rem, 2.5vw, 0.75rem);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.2);
            animation: fadeIn 3s 1.5s ease forwards, hintBlink 3s 3s ease-in-out infinite;
            opacity: 0;
            pointer-events: none;
        }

        @keyframes hintBlink {

            0%,
            100% {
                opacity: 0.2;
            }

            50% {
                opacity: 0.5;
            }
        }

        #phrase {
            position: fixed;
            bottom: clamp(3rem, 12vw, 5rem);
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            width: 90%;
            max-width: 340px;
            pointer-events: none;
        }

        #phrase span {
            display: inline-block;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 0.5px solid rgba(255, 133, 161, 0.25);
            border-radius: 100px;
            padding: clamp(0.6rem, 3vw, 0.9rem) clamp(1.2rem, 5vw, 2rem);
            font-size: clamp(0.9rem, 3.5vw, 1.1rem);
            font-style: italic;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 0.02em;
            opacity: 0;
            transform: translateY(16px) scale(0.94);
            transition: none;
            box-shadow: 0 8px 32px rgba(255, 77, 109, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        #phrase span.show {
            animation: phraseIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        #phrase span.hide {
            animation: phraseOut 0.4s ease forwards;
        }

        @keyframes phraseIn {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes phraseOut {
            to {
                opacity: 0;
                transform: translateY(-10px) scale(0.96);
            }
        }

        /* ── Carta final ── */
        #carta-overlay {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(1rem, 5vw, 2rem);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }

        #carta-overlay.visible {
            opacity: 1;
            pointer-events: all;
        }

        /* Fondo difuminado */
        #carta-overlay::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(5, 2, 8, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        #carta {
            position: relative;
            width: 100%;
            max-width: 360px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 0.5px solid rgba(255, 133, 161, 0.3);
            border-radius: 24px;
            padding: clamp(1.8rem, 7vw, 2.8rem) clamp(1.5rem, 6vw, 2.4rem);
            box-shadow:
                0 0 60px rgba(255, 77, 109, 0.12),
                0 30px 80px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
            transform: scale(0.85) translateY(40px);
            transition: transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.3s;
        }

        #carta-overlay.visible #carta {
            transform: scale(1) translateY(0);
        }

        #carta-deco {
            font-size: clamp(2.5rem, 10vw, 3.5rem);
            margin-bottom: 1rem;
            animation: cartaFloat 3s ease-in-out infinite;
        }

        @keyframes cartaFloat {

            0%,
            100% {
                transform: translateY(0) rotate(-3deg);
            }

            50% {
                transform: translateY(-8px) rotate(3deg);
            }
        }

        #carta h2 {
            font-size: clamp(1.1rem, 4.5vw, 1.5rem);
            font-weight: 300;
            font-style: italic;
            color: rgba(255, 255, 255, 0.95);
            line-height: 1.4;
            margin-bottom: 1.2rem;
            letter-spacing: 0.01em;
        }

        #carta p {
            font-family: 'Montserrat', sans-serif;
            font-weight: 200;
            font-size: clamp(0.75rem, 3vw, 0.85rem);
            color: rgba(255, 255, 255, 0.45);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 2rem;
            line-height: 1.8;
        }

        #carta .firma {
            font-size: clamp(1rem, 4vw, 1.3rem);
            font-style: italic;
            font-weight: 300;
            color: var(--rose-pale);
            letter-spacing: 0.05em;
        }

        #carta-close {
            display: inline-block;
            margin-top: 1.8rem;
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(0.65rem, 2.5vw, 0.7rem);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            border-bottom: 0.5px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 2px;
            transition: color 0.2s, border-color 0.2s;
        }

        #carta-close:hover {
            color: rgba(255, 255, 255, 0.5);
            border-color: rgba(255, 255, 255, 0.4);
        }

        #beats-counter {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            z-index: 5;
            font-family: 'Montserrat', sans-serif;
            font-weight: 200;
            font-size: 0.65rem;
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.12);
            pointer-events: none;
            transition: color 0.3s;
        }

        /* ── Utilidades ── */
        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        /* Línea decorativa en la carta */
        #carta .divider {
            width: 40px;
            height: 0.5px;
            background: linear-gradient(90deg, transparent, rgba(255, 133, 161, 0.5), transparent);
            margin: 0 auto 1.5rem;
        }
    </style>
</head>

<body>

    <div id="bg"></div>
    <canvas id="canvas"></canvas>

    <div id="scene">
        <div id="titulo">
            <p>Santiago💕</p>
            <h1>Cada latido<br>me recuerda a ti</h1>
        </div>

        <div id="heart-wrap">
            <div id="heart-glow"></div>
            <svg id="heart-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Gradiente principal 3D -->
                    <radialGradient id="hg" cx="38%" cy="32%" r="65%">
                        <stop offset="0%" stop-color="#ff8fa8" />
                        <stop offset="40%" stop-color="#ff4d6d" />
                        <stop offset="100%" stop-color="#8b0022" />
                    </radialGradient>
                    <!-- Gradiente brillante lateral -->
                    <linearGradient id="hg2" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="rgba(255,200,210,0.35)" />
                        <stop offset="100%" stop-color="rgba(80,0,20,0)" />
                    </linearGradient>
                    <!-- Filtro de sombra interna -->
                    <filter id="innerShadow">
                        <feOffset dx="2" dy="4" />
                        <feGaussianBlur stdDeviation="6" result="offset-blur" />
                        <feFlood flood-color="#400010" flood-opacity="0.4" result="color" />
                        <feComposite in="color" in2="offset-blur" operator="in" result="shadow" />
                        <feMerge>
                            <feMergeNode in="shadow" />
                            <feMergeNode in="SourceGraphic" />
                        </feMerge>
                    </filter>
                    <!-- Clippath del corazón -->
                    <clipPath id="heartClip">
                        <path
                            d="M100 170 C60 145, 15 120, 15 75 C15 45, 35 28, 55 28 C70 28, 85 37, 100 52 C115 37, 130 28, 145 28 C165 28, 185 45, 185 75 C185 120, 140 145, 100 170 Z" />
                    </clipPath>
                </defs>

                <!-- Sombra exterior -->
                <ellipse cx="102" cy="165" rx="58" ry="12" fill="rgba(0,0,0,0.25)" filter="url(#blur2)" />

                <!-- Cuerpo del corazón -->
                <path id="heart-path"
                    d="M100 170 C60 145, 15 120, 15 75 C15 45, 35 28, 55 28 C70 28, 85 37, 100 52 C115 37, 130 28, 145 28 C165 28, 185 45, 185 75 C185 120, 140 145, 100 170 Z"
                    fill="url(#hg)" filter="url(#innerShadow)" />

                <!-- Capa de brillo 3D -->
                <path
                    d="M100 170 C60 145, 15 120, 15 75 C15 45, 35 28, 55 28 C70 28, 85 37, 100 52 C115 37, 130 28, 145 28 C165 28, 185 45, 185 75 C185 120, 140 145, 100 170 Z"
                    fill="url(#hg2)" />

                <!-- Reflejo brillante superior izquierdo -->
                <ellipse cx="70" cy="62" rx="20" ry="14" fill="rgba(255,255,255,0.18)" transform="rotate(-35 70 62)"
                    clip-path="url(#heartClip)" />

                <!-- Punto de brillo pequeño -->
                <ellipse cx="62" cy="55" rx="7" ry="5" fill="rgba(255,255,255,0.35)" transform="rotate(-35 62 55)"
                    clip-path="url(#heartClip)" />
            </svg>
        </div>

        <div id="hint">toca el corazón</div>
    </div>

    <!-- Frase flotante -->
    <div id="phrase"><span></span></div>

    <!-- Contador de latidos -->
    <div id="beats-counter">♡ <span id="beat-num">0</span></div>

    <!-- Carta final -->
    <div id="carta-overlay">
        <div id="carta">
            <div id="carta-deco">💌</div>
            <h2>Estar a tu lado<br>es mi lugar favorito</h2>
            <div class="divider"></div>
            <p>Mi parte favorita de el dia...<br>es cuando estoy a tu lado.</p>
            <div class="firma">
                <a href="https://www.youtube.com/watch?v=xj6DqykaYi4&list=RDxj6DqykaYi4&start_radio=1" target="_blank">
                    — siempre tuya Daniela ❤
                </a>
            </div>
            <div id="carta-close" onclick="cerrarCarta()">cerrar</div>
        </div>
    </div>

    <script>
        // ─── Estado ───────────────────────────────────
        const FRASES = [
            "me encanta hablar contigo",
            "tu sonrisa me mata",
            "eres mi lugar favorito",
            "pienso en ti todo el tiempo",
        ];
        let beats = 0;
        let phraseIndex = 0;
        let cartaShown = false;
        let canBeat = true;

        // ─── Audio suave (sintetizado) ────────────────
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playPop() {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.type = 'sine';
                osc.frequency.setValueAtTime(520, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(280, audioCtx.currentTime + 0.18);

                gain.gain.setValueAtTime(0, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.22, audioCtx.currentTime + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);

                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.25);
            } catch (e) { }
        }

        // ─── Partículas (Canvas) ──────────────────────
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        function heartPoint(t) {
            // Curva del corazón paramétrica (normalizada para escalar)
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            return { x, y };
        }

        function spawnParticles(cx, cy) {
            const count = 28;
            for (let i = 0; i < count; i++) {
                const angle = (Math.random() * Math.PI * 2);
                const speed = 1.5 + Math.random() * 3.5;
                const size = 3 + Math.random() * 6;
                const hue = 330 + Math.random() * 40; // rosas/rojos
                const sat = 80 + Math.random() * 20;

                // Algunas partículas son mini corazones ♡
                const isHeart = Math.random() < 0.3;

                particles.push({
                    x: cx + (Math.random() - 0.5) * 30,
                    y: cy + (Math.random() - 0.5) * 30,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 1.5,
                    size, hue, sat,
                    alpha: 1,
                    decay: 0.016 + Math.random() * 0.012,
                    isHeart,
                    rotation: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 0.12,
                });
            }
        }

        function drawHeart(ctx, x, y, size) {
            ctx.save();
            ctx.translate(x, y);
            ctx.beginPath();
            for (let t = 0; t <= Math.PI * 2; t += 0.1) {
                const p = heartPoint(t);
                const px = p.x * size / 16;
                const py = p.y * size / 16;
                t === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            particles = particles.filter(p => p.alpha > 0.01);

            for (const p of particles) {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.06; // gravedad suave
                p.vx *= 0.98;
                p.alpha -= p.decay;
                p.rotation += p.rotSpeed;

                ctx.save();
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.fillStyle = `hsl(${p.hue}, ${p.sat}%, 75%)`;

                if (p.isHeart) {
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rotation);
                    drawHeart(ctx, 0, 0, p.size * 1.4);
                } else {
                    // Círculo brillante
                    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
                    g.addColorStop(0, `hsl(${p.hue}, ${p.sat}%, 90%)`);
                    g.addColorStop(1, `hsla(${p.hue}, ${p.sat}%, 60%, 0)`);
                    ctx.fillStyle = g;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // ─── Frase emergente ──────────────────────────
        const phraseEl = document.querySelector('#phrase span');
        let phraseTimeout = null;

        function showPhrase(txt) {
            if (phraseTimeout) clearTimeout(phraseTimeout);

            phraseEl.classList.remove('show', 'hide');
            void phraseEl.offsetWidth; // reflow
            phraseEl.textContent = txt;
            phraseEl.classList.add('show');

            phraseTimeout = setTimeout(() => {
                phraseEl.classList.remove('show');
                phraseEl.classList.add('hide');
            }, 2800);
        }

        // ─── Latido ───────────────────────────────────
        const heartSvg = document.getElementById('heart-svg');
        const heartWrap = document.getElementById('heart-wrap');
        const beatNumEl = document.getElementById('beat-num');

        function doBeat(e) {
            if (!canBeat) return;
            canBeat = false;

            beats++;
            beatNumEl.textContent = beats;

            // Animación latido
            heartSvg.classList.remove('beating');
            void heartSvg.offsetWidth;
            heartSvg.classList.add('beating');
            setTimeout(() => heartSvg.classList.remove('beating'), 500);

            // Posición del corazón para partículas
            const rect = heartWrap.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            spawnParticles(cx, cy);

            // Sonido
            playPop();

            // Frase (cicla y evita repetir)
            const frase = FRASES[phraseIndex % FRASES.length];
            phraseIndex++;
            showPhrase(`"${frase}"`);

            // ¿Carta final tras 5 latidos?
            if (beats >= 5 && !cartaShown) {
                cartaShown = true;
                setTimeout(mostrarCarta, 1200);
            }

            setTimeout(() => { canBeat = true; }, 600);
        }

        heartWrap.addEventListener('click', doBeat);
        heartWrap.addEventListener('touchstart', e => { e.preventDefault(); doBeat(e); }, { passive: false });

        // ─── Carta ────────────────────────────────────
        const cartaOverlay = document.getElementById('carta-overlay');

        function mostrarCarta() {
            // Explosión de partículas masiva
            const rect = heartWrap.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            for (let i = 0; i < 3; i++) {
                setTimeout(() => spawnParticles(cx, cy), i * 150);
            }
            setTimeout(() => {
                cartaOverlay.classList.add('visible');
            }, 400);
        }

        function cerrarCarta() {
            cartaOverlay.classList.remove('visible');
        }

        // Cerrar tocando fuera de la carta
        cartaOverlay.addEventListener('click', e => {
            if (e.target === cartaOverlay) cerrarCarta();
        });

        // ─── Partículas ambientales (fondo) ──────────
        function ambientParticle() {
            const x = Math.random() * window.innerWidth;
            const y = window.innerHeight + 10;
            particles.push({
                x, y,
                vx: (Math.random() - 0.5) * 0.4,
                vy: -(0.3 + Math.random() * 0.5),
                size: 1 + Math.random() * 2.5,
                hue: 330 + Math.random() * 40,
                sat: 60 + Math.random() * 40,
                alpha: 0.15 + Math.random() * 0.2,
                decay: 0.002,
                isHeart: Math.random() < 0.15,
                rotation: 0,
                rotSpeed: (Math.random() - 0.5) * 0.03,
            });
        }
        setInterval(ambientParticle, 400);
    </script>
</body>

</html>
